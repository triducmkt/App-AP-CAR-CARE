<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AP CAR CARE - Audio &amp; Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      --blue: #4285F4;
      --blue-light: #8AB4F8;

      /* Kích thước Header trong Card */
      --L: 52px;                                   /* Đường kính logo AP */
      --gap: 14px;                                 /* Khoảng cách logo - chữ */
      --TH: calc(var(--L) * 0.92);                 /* Chiều cao chữ thương hiệu */
      --TW: calc(var(--TH) * 3.9823);              /* Chiều rộng chữ thương hiệu */
      --s0: 3.8;                                   /* Tỉ lệ logo phóng to ban đầu ở giữa màn hình */
    }

    @media (max-width: 540px) {
      :root {
        --L: 44px;
        --gap: 12px;
        --s0: 4.0;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: var(--font-primary);
      color: #FFFFFF;
      user-select: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      background: #020408;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       1. CÁC VÙNG ÁNH SÁNG XANH STUDIO (TĂNG ĐỘ RÕ 15-20% THEO YÊU CẦU CỦA ANH ĐỨC)
       ========================================================================== */
    .bg-ambient-bl {
      position: absolute;
      left: -10%;
      bottom: -10%;
      width: 85vw;
      height: 85vh;
      background: radial-gradient(circle at 22% 78%, 
        rgba(30, 68, 126, 0.70) 0%, 
        rgba(18, 44, 85, 0.48) 32%, 
        rgba(8, 20, 44, 0.26) 58%, 
        transparent 78%
      );
      filter: blur(42px);
      pointer-events: none;
      z-index: 1;
    }

    .bg-ambient-tr {
      position: absolute;
      top: -15%;
      right: -15%;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(ellipse 80% 70% at 85% 15%, 
          rgba(48, 105, 185, 0.58) 0%, 
          rgba(25, 62, 115, 0.42) 35%, 
          rgba(12, 30, 60, 0.22) 65%, 
          transparent 85%
        ),
        linear-gradient(220deg, 
          rgba(36, 85, 160, 0.25) 0%, 
          rgba(16, 40, 80, 0.12) 35%, 
          transparent 65%
        );
      filter: blur(42px);
      pointer-events: none;
      z-index: 2;
    }

    /* ==========================================================================
       2. DẢI HỌA TIẾT LỤA (VUỐT NHỌN GÓC DƯỚI-PHẢI, XÒE RỘNG LÊN GÓC TRÊN-TRÁI)
          + DẢI ÁNH SÁNG GRADIENT TRẮNG NẰM FIX BÁM THEO DẢI HỌA TIẾT LÀM NỀN
          + CHÙM ÁNH SÁNG NGÔI SAO MÀU TRẮNG GLOW LƯỚT CHẬM DẦN TỪ 2.2S
       ========================================================================== */
    .bg-ribbon-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transform: translateY(50px);
      /* Bắt đầu animate gối đầu ở thời điểm logo AP vừa xuất hiện xong (2.2s) */
      animation: ribbonSlideUp 2.2s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
    }

    .bg-ribbon-svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* ==========================================================================
       3. ÁNH SÁNG QUANG HỌC BAN ĐẦU & INTRO LOGO TẠI TÂM (0s -> 2.8s)
       ========================================================================== */
    .optic-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 440px;
      height: 440px;
      margin: -220px 0 0 -220px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      background: radial-gradient(circle, 
        rgba(255, 255, 255, 1) 0%, 
        rgba(138, 180, 248, 0.95) 12%, 
        rgba(66, 133, 244, 0.45) 30%, 
        rgba(66, 133, 244, 0.08) 55%, 
        transparent 70%
      );
      filter: blur(2px);
      animation: opticCoreBurst 1.25s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
    }

    .optic-laser {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100vw;
      height: 3px;
      margin-top: -1.5px;
      margin-left: -50vw;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(66, 133, 244, 0.2) 20%, 
        rgba(138, 180, 248, 0.95) 45%, 
        #FFFFFF 50%, 
        rgba(138, 180, 248, 0.95) 55%, 
        rgba(66, 133, 244, 0.2) 80%, 
        transparent 100%
      );
      box-shadow: 
        0 0 16px rgba(255, 255, 255, 0.95), 
        0 0 35px rgba(138, 180, 248, 0.8), 
        0 0 70px rgba(66, 133, 244, 0.5);
      animation: opticLaserBeam 1.35s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
    }

    .optic-spike-v {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2.5px;
      height: 70vh;
      margin-left: -1.25px;
      margin-top: -35vh;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      background: linear-gradient(180deg, 
        transparent 0%, 
        rgba(138, 180, 248, 0.4) 30%, 
        #FFFFFF 50%, 
        rgba(138, 180, 248, 0.4) 70%, 
        transparent 100%
      );
      box-shadow: 0 0 20px rgba(138, 180, 248, 0.8);
      animation: opticSpikeV 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    .optic-halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 320px;
      height: 320px;
      margin: -160px 0 0 -160px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      border: 1.5px solid rgba(138, 180, 248, 0.7);
      box-shadow: 
        0 0 30px rgba(138, 180, 248, 0.5), 
        inset 0 0 30px rgba(138, 180, 248, 0.3);
      animation: opticHaloExpand 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.85s forwards;
    }

    /* Logo Hero lớn ban đầu tại tâm màn hình */
    .hero-intro-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--L) * var(--s0));
      height: calc(var(--L) * var(--s0));
      margin: calc(var(--L) * var(--s0) / -2) 0 0 calc(var(--L) * var(--s0) / -2);
      border-radius: 50%;
      pointer-events: none;
      z-index: 25;
      opacity: 0;
      animation: heroLogoSequence 2.1s cubic-bezier(0.2, 0.8, 0.25, 1) 1.25s forwards;
    }

    .hero-intro-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      box-shadow: 0 18px 50px -6px rgba(255, 255, 255, 0.22), 0 0 85px rgba(138, 180, 248, 0.16);
    }

    .hero-intro-glint {
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      animation: specularGlint 1.25s cubic-bezier(0.2, 0.8, 0.25, 1) 1.75s forwards;
    }

    .hero-intro-glint::before {
      content: '';
      position: absolute;
      top: -70%;
      left: -90%;
      width: 65%;
      height: 240%;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.15) 25%, 
        #FFFFFF 50%, 
        rgba(138, 180, 248, 0.85) 70%, 
        transparent 100%
      );
      transform: rotate(38deg);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.9);
      animation: glintSweep 1.25s cubic-bezier(0.2, 0.8, 0.25, 1) 1.75s forwards;
    }

    /* ==========================================================================
       4. KHUNG THẺ KÍNH MỜ GLASSMORPHISM (CHUẨN THEO HÌNH MẪU CỦA ANH ĐỨC)
       - Nằm chính giữa màn hình (Flexbox centered)
       - Cạnh trên & cạnh phải viền sáng ánh kim sắc nét
       ========================================================================== */
    .glass-card {
      position: relative;
      z-index: 20;
      width: 384px;
      max-width: calc(100vw - 36px);
      padding: 40px 32px 34px;
      background: linear-gradient(142deg, 
        rgba(255, 255, 255, 0.15) 0%, 
        rgba(36, 44, 58, 0.46) 38%, 
        rgba(14, 18, 26, 0.72) 100%
      );
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 1px solid rgba(255, 255, 255, 0.52);
      border-right: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 35px 85px rgba(0, 0, 0, 0.96), 
        inset 0 1px 1px rgba(255, 255, 255, 0.42), 
        inset -1px 0 1px rgba(255, 255, 255, 0.14),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      /* Gối đầu xuất hiện ngay khi logo hero bắt đầu chuyển tiếp */
      animation: glassCardIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 2.4s forwards;
    }

    @media (max-width: 540px) {
      .glass-card {
        width: min(calc(100vw - 32px), 340px);
        padding: 32px 20px 26px;
        border-radius: 22px;
      }
    }

    /* ==========================================================================
       5. HEADER THƯƠNG HIỆU: RÀNG BUỘC CỐ ĐỊNH LOGO VÀ CHỮ LUÔN ĐỨNG KẾ BÊN NHAU
       ========================================================================== */
    .card-brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gap);
      margin-bottom: 24px;
      width: 100%;
      position: relative;
    }

    .brand-logo-slot {
      width: var(--L);
      height: var(--L);
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      opacity: 0;
      animation: brandLogoIn 0.75s ease 2.6s forwards;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6), 0 0 14px rgba(255, 255, 255, 0.18);
    }

    .brand-text-slot {
      width: var(--TW);
      height: var(--TH);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .brand-text-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      animation: brandTextReveal 0.95s cubic-bezier(0.22, 1, 0.36, 1) 2.75s forwards;
    }

    /* ==========================================================================
       6. FORM ĐĂNG NHẬP CAPSULE & NÚT 3D OFF-WHITE
       ========================================================================== */
    .form-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sync-obj {
      opacity: 0;
      transform: translateY(18px);
    }

    .sync-1 {
      animation: syncObjectIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 3.0s forwards;
    }

    .sync-2 {
      animation: syncObjectIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 3.2s forwards;
    }

    .sync-3 {
      animation: syncObjectIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 3.4s forwards;
      margin-top: 4px;
    }

    .sync-4 {
      animation: syncObjectIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 3.6s forwards;
    }

    .input-capsule {
      width: 100%;
      height: 46px;
      padding: 0 22px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-family: var(--font-primary);
      font-size: 13.5px;
      font-weight: 400;
      color: #FFFFFF;
      letter-spacing: 0.02em;
      outline: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 540px) {
      .input-capsule {
        height: 44px;
        padding: 0 18px;
        font-size: 13px;
      }
    }

    .input-capsule::placeholder {
      color: rgba(255, 255, 255, 0.42);
      font-weight: 400;
      transition: opacity 0.2s ease;
    }

    .input-capsule:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 
        0 0 16px rgba(255, 255, 255, 0.25), 
        0 0 28px rgba(138, 180, 248, 0.2);
    }

    .input-capsule:focus::placeholder {
      opacity: 0.2;
    }

    .btn-capsule {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 9999px;
      cursor: pointer;
      font-family: var(--font-primary);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.26em;
      text-indent: 0.26em;
      text-transform: uppercase;
      color: #0A0A0E;
      background: linear-gradient(180deg, #FFFFFF 0%, #ECECF0 52%, #DBDCE2 100%);
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.75), 
        inset 0 1px 1px #FFFFFF, 
        inset 0 -2px 3px rgba(0, 0, 0, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 540px) {
      .btn-capsule {
        height: 46px;
        font-size: 12.5px;
      }
    }

    .btn-capsule:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, #F5F5F8 52%, #E8E8EE 100%);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.85), 
        0 0 24px rgba(255, 255, 255, 0.25), 
        inset 0 1px 1px #FFFFFF;
      transform: translateY(-1px);
    }

    .btn-capsule:active {
      transform: translateY(0);
      background: #E2E2E6;
    }

    .btn-capsule:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-capsule::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -70%;
      width: 45%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.65), transparent);
      transform: skewX(-20deg);
      animation: btnSheen 1.3s ease 4.2s 1 both;
    }

    .forgot-link-wrap {
      text-align: center;
      padding-top: 2px;
    }

    .forgot-link {
      display: inline-block;
      font-family: var(--font-primary);
      font-weight: 400;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
      transition: all 0.25s ease;
    }

    .forgot-link:hover {
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .form-feedback {
      display: none;
      font-size: 11.5px;
      line-height: 1.45;
      color: #FF6B6B;
      text-align: center;
      margin-top: 6px;
      letter-spacing: 0.02em;
      animation: feedbackFadeIn 0.3s ease forwards;
    }

    .form-feedback.active {
      display: block;
    }

    .form-feedback.success {
      color: #8AB4F8;
    }

    /* Modal Quên mật khẩu */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(18, 20, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 255, 255, 0.05);
      border-radius: 22px;
      width: 100%;
      max-width: 380px;
      padding: 28px 24px;
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.9);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    .modal-desc {
      font-size: 13px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 22px;
    }

    .modal-btn-close {
      width: 100%;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .modal-btn-close:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Keyframes */
    @keyframes ribbonSlideUp {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes opticCoreBurst {
      0%   { opacity: 0; transform: scale(0.15); }
      30%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1.4); }
    }

    @keyframes opticLaserBeam {
      0%   { opacity: 0; transform: scaleX(0); }
      35%  { opacity: 1; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(1.15); }
    }

    @keyframes opticSpikeV {
      0%   { opacity: 0; transform: scaleY(0); }
      35%  { opacity: 0.9; transform: scaleY(1); }
      100% { opacity: 0; transform: scaleY(1.2); }
    }

    @keyframes opticHaloExpand {
      0%   { opacity: 0; transform: scale(0.2); }
      40%  { opacity: 0.85; }
      100% { opacity: 0; transform: scale(1.65); }
    }

    @keyframes heroLogoSequence {
      0% {
        opacity: 0;
        filter: blur(14px);
        transform: scale(0.92);
      }
      25% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
      75% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
      100% {
        opacity: 0;
        filter: blur(8px);
        transform: scale(0.45);
      }
    }

    @keyframes specularGlint {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes glintSweep {
      0%   { left: -90%; }
      100% { left: 140%; }
    }

    @keyframes glassCardIn {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.94);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes brandLogoIn {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes brandTextReveal {
      0% {
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        transform: translateX(-16px);
      }
      100% {
        opacity: 1;
        clip-path: inset(0 0 0 0);
        transform: translateX(0);
      }
    }

    @keyframes syncObjectIn {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes btnSheen {
      0%   { left: -70%; }
      100% { left: 140%; }
    }

    @keyframes feedbackFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- 1. CÁC VÙNG ÁNH SÁNG XANH STUDIO (GIỮ NGUYÊN 100%) -->
    <div class="bg-ambient-bl"></div>
    <div class="bg-ambient-tr"></div>

    <!-- 2. DẢI HỌA TIẾT LỤA (VUỐT NHỌN GÓC DƯỚI-PHẢI, XÒE RỘNG LÊN GÓC TRÊN-TRÁI)
            + DẢI ÁNH SÁNG GRADIENT TRẮNG BÁM THEO LÀM NỀN
            + CHÙM ÁNH SÁNG NGÔI SAO MÀU TRẮNG GLOW LƯỚT CHẬM DẦN TỪ GÓC DƯỚI-PHẢI -->
    <div class="bg-ribbon-layer">
      <svg class="bg-ribbon-svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="none">
        <defs>
          <!-- Gradient phát sáng trắng mềm mại ôm sát bám theo dải lụa -->
          <linearGradient id="whiteGlowGrad" x1="100%" y1="90%" x2="0%" y2="25%">
            <stop offset="0%" stop-color="#4285F4" stop-opacity="0.1"/>
            <stop offset="25%" stop-color="#8AB4F8" stop-opacity="0.3"/>
            <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.6"/>
            <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#C5DEFF" stop-opacity="0.85"/>
          </linearGradient>

          <!-- Gradient thân dải lụa mềm mại -->
          <linearGradient id="ribbonBodyGrad" x1="100%" y1="85%" x2="0%" y2="25%">
            <stop offset="0%" stop-color="#1A3355" stop-opacity="0.12"/>
            <stop offset="25%" stop-color="#2D5A96" stop-opacity="0.25"/>
            <stop offset="60%" stop-color="#709BD2" stop-opacity="0.38"/>
            <stop offset="85%" stop-color="#B8D5FA" stop-opacity="0.48"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
          </linearGradient>

          <!-- Gradient các đường line trắng nhuyễn, mờ nhẹ chuẩn theo hình mẫu -->
          <linearGradient id="fineLineGrad" x1="100%" y1="85%" x2="0%" y2="25%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.45"/>
            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
          </linearGradient>

          <!-- Bộ lọc mờ sương cho dải phát sáng trắng -->
          <filter id="ribbonGlowBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="38" result="blur"/>
          </filter>

          <!-- Hào quang trắng tỏa sáng của chùm ngôi sao -->
          <radialGradient id="starWhiteGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
            <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.85"/>
            <stop offset="65%" stop-color="#8AB4F8" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- A. DẢI ÁNH SÁNG GRADIENT TRẮNG LÀM NỀN (NẰM FIX BÁM THEO DẢI HỌA TIẾT LỤA) -->
        <path d="M 1480,820 C 1180,795 960,675 720,590 C 480,505 260,360 -40,220" 
              stroke="url(#whiteGlowGrad)" 
              stroke-width="160" 
              stroke-linecap="round" 
              fill="none" 
              filter="url(#ribbonGlowBlur)" 
              opacity="0.75" />

        <path d="M 1480,820 C 1180,795 960,675 720,590 C 480,505 260,360 -40,220" 
              stroke="#FFFFFF" 
              stroke-width="70" 
              stroke-linecap="round" 
              fill="none" 
              filter="url(#ribbonGlowBlur)" 
              opacity="0.45" />

        <!-- B. KHỐI DẢI LỤA: VUỐT NHỌN Ở GÓC DƯỚI-PHẢI, XÒE RỘNG LÊN GÓC TRÊN-TRÁI -->
        <!-- Mũi nhọn tại X=1480, Y=820 -> xòe rộng tại X=-40, Y=175 đến 265 -->
        <path d="M 1480,820 
                 C 1180,808 960,695 720,612 
                 C 480,530 260,395 -40,265 
                 L -40,175 
                 C 260,325 480,480 720,568 
                 C 960,655 1180,782 1480,818 Z" 
              fill="url(#ribbonBodyGrad)" 
              opacity="0.45" />

        <!-- C. CÁC ĐƯỜNG LINE TRẮNG NHIỀU, NHUYỄN, KHÔNG QUÁ ĐẬM (FOLLOW 100% THEO HÌNH MẪU) -->
        <!-- 12 đường line mảnh nhuyễn uốn lượn, quy tụ nhọn ở góc dưới-phải và xòe nhẹ nhàng lên trên-trái -->
        <path d="M 1480,818 C 1180,782 960,655 720,568 C 480,325 260,325 -40,175" 
              stroke="url(#fineLineGrad)" stroke-width="1.3" fill="none" opacity="0.65" />

        <path d="M 1480,818 C 1180,785 960,660 720,572 C 480,335 260,335 -40,183" 
              stroke="url(#fineLineGrad)" stroke-width="1.0" fill="none" opacity="0.45" />

        <path d="M 1480,819 C 1180,788 960,665 720,576 C 480,345 260,345 -40,191" 
              stroke="url(#fineLineGrad)" stroke-width="1.1" fill="none" opacity="0.55" />

        <path d="M 1480,819 C 1180,790 960,670 720,580 C 480,355 260,355 -40,199" 
              stroke="url(#fineLineGrad)" stroke-width="0.9" fill="none" opacity="0.4" />

        <path d="M 1480,819 C 1180,792 960,673 720,585 C 480,498 260,358 -40,208" 
              stroke="url(#fineLineGrad)" stroke-width="1.2" fill="none" opacity="0.6" />

        <!-- Đường gân trung tâm sống lưng -->
        <path d="M 1480,820 C 1180,795 960,675 720,590 C 480,505 260,360 -40,220" 
              stroke="url(#fineLineGrad)" stroke-width="1.5" fill="none" opacity="0.75" />

        <path d="M 1480,820 C 1180,798 960,680 720,595 C 480,512 260,370 -40,230" 
              stroke="url(#fineLineGrad)" stroke-width="1.0" fill="none" opacity="0.45" />

        <path d="M 1480,820 C 1180,800 960,685 720,600 C 480,518 260,378 -40,240" 
              stroke="url(#fineLineGrad)" stroke-width="1.1" fill="none" opacity="0.5" />

        <path d="M 1480,821 C 1180,803 960,690 720,605 C 480,523 260,385 -40,250" 
              stroke="url(#fineLineGrad)" stroke-width="0.9" fill="none" opacity="0.4" />

        <path d="M 1480,821 C 1180,805 960,693 720,608 C 480,526 260,390 -40,258" 
              stroke="url(#fineLineGrad)" stroke-width="1.0" fill="none" opacity="0.45" />

        <path d="M 1480,821 C 1180,808 960,695 720,612 C 480,530 260,395 -40,265" 
              stroke="url(#fineLineGrad)" stroke-width="1.3" fill="none" opacity="0.6" />

        <!-- D. CHÙM ÁNH SÁNG NGÔI SAO MÀU TRẮNG QUANG HỌC (NHỎ LẠI 50%, TIA SÁNG KÉO DÀI, VUỐT NHỌN MỊN VÀ SẮC SẢO)
                ANIMATE GỐI ĐẦU Ở THỜI ĐIỂM LOGO AP VỪA XUẤT HIỆN XONG (2.2S) -->
        <g id="starComet" opacity="0">
          <!-- Hào quang màu trắng dịu glow (thu nhỏ 50% từ r=46 xuống r=23) -->
          <circle cx="0" cy="0" r="23" fill="url(#starWhiteGlow)" />

          <!-- Tia sáng ngang kéo dài vuốt nhọn mịn như lưỡi kiếm (tapered needle horizontal spike) -->
          <path d="M 0,-1.4 C 14,-0.45 38,-0.12 58,0 C 38,0.12 14,0.45 0,1.4 C -14,0.45 -38,0.12 -58,0 C -38,-0.12 -14,-0.45 0,-1.4 Z" fill="#FFFFFF" opacity="0.95" />
          <line x1="-56" y1="0" x2="56" y2="0" stroke="#FFFFFF" stroke-width="0.75" opacity="1" />

          <!-- Tia sáng dọc kéo dài vuốt nhọn mịn sắc sảo (tapered needle vertical spike) -->
          <path d="M -1.2,0 C -0.4,-10 -0.12,-30 0,-48 C 0.12,-30 0.4,-10 1.2,0 C 0.4,10 0.12,30 0,48 C -0.12,30 -0.4,10 -1.2,0 Z" fill="#FFFFFF" opacity="0.95" />
          <line x1="0" y1="-46" x2="0" y2="46" stroke="#FFFFFF" stroke-width="0.75" opacity="1" />

          <!-- 4 tia chéo phụ 45 độ vuốt nhọn thanh mảnh (độ dài 19px) -->
          <g transform="rotate(45)">
            <path d="M 0,-0.8 C 4,-0.25 12,-0.08 19,0 C 12,0.08 4,0.25 0,0.8 C -4,0.25 -12,0.08 -19,0 C -12,-0.08 -4,-0.25 0,-0.8 Z" fill="#FFFFFF" opacity="0.8" />
            <path d="M -0.8,0 C -0.25,-4 -0.08,-12 0,-19 C 0.08,-12 0.25,-4 0.8,0 C 0.25,4 0.08,12 0,19 C -0.08,12 -0.25,4 -0.8,0 Z" fill="#FFFFFF" opacity="0.8" />
          </g>

          <!-- Ngôi sao 4 cánh sắc bén tại tâm (thu nhỏ 50% từ r=18 xuống r=9) -->
          <path d="M 0,-9 C 0.7,-2.8 2.8,-0.7 9,0 C 2.8,0.7 0.7,2.8 0,9 C -0.7,2.8 -2.8,0.7 -9,0 C -2.8,-0.7 -0.7,-2.8 0,-9 Z" fill="#FFFFFF" />
          <!-- Điểm sáng trung tâm siêu mịn (thu nhỏ 50% từ r=4.5 xuống r=2.2) -->
          <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />

          <!-- Quỹ đạo di chuyển chậm dần từ góc dưới-phải chéo lên góc trên-trái -->
          <animateMotion 
            path="M 1480,820 C 1180,795 960,675 720,590 C 480,505 260,360 -40,220" 
            begin="2.2s" 
            dur="2.4s" 
            fill="freeze"
            calcMode="spline"
            keyTimes="0; 1"
            keySplines="0.12 0.75 0.22 1"
          />
          <!-- Độ trong suốt: hiện ra khi bắt đầu ở góc dưới-phải và tan dần khi đến đích -->
          <animate 
            attributeName="opacity" 
            values="0; 1; 1; 0.9; 0" 
            keyTimes="0; 0.1; 0.7; 0.9; 1" 
            begin="2.2s" 
            dur="2.4s" 
            fill="freeze" 
          />
        </g>
      </svg>
    </div>

      <!-- Form đăng nhập Capsule & Nút 3D Off-White -->
      <form class="form-content" id="loginForm" autocomplete="on" novalidate>
        <div class="sync-obj sync-1">
          <input class="input-capsule" id="txtUsername" name="username" type="text" placeholder="Tên đăng nhập" autocomplete="username">
        </div>
        <div class="sync-obj sync-2">
          <input class="input-capsule" id="txtPassword" name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
        </div>
        <div class="sync-obj sync-3">
          <button class="btn-capsule" id="btnLogin" type="submit">ĐĂNG NHẬP</button>
        </div>
        <div class="sync-obj sync-4">
          <div class="forgot-link-wrap">
            <a class="forgot-link" id="linkForgot" href="javascript:void(0)">Quên mật khẩu?</a>
          </div>
          <!-- Dòng thông báo trạng thái/lỗi màu đỏ mềm mại theo hình mẫu của anh Đức -->
          <div class="form-feedback" id="formFeedback"></div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL QUÊN MẬT KHẨU -->
  <div class="modal-overlay" id="modalForgot" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <h3 class="modal-title">Cấp Lại Mật Khẩu</h3>
      <p class="modal-desc">
        Hệ thống phân quyền nội bộ AP CAR CARE.<br>
        Để được cấp lại thông tin truy cập, vui lòng liên hệ trực tiếp Quản lý chi nhánh hoặc Hotline IT nội bộ:
        <br><strong style="color: #FFFFFF; display: inline-block; margin-top: 8px; font-size: 14px; letter-spacing: 0.05em;">098 123 4567</strong>
      </p>
      <button class="modal-btn-close" id="btnCloseModal" type="button">ĐÃ HIỂU</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const loginForm = document.getElementById('loginForm');
      const txtUsername = document.getElementById('txtUsername');
      const txtPassword = document.getElementById('txtPassword');
      const btnLogin = document.getElementById('btnLogin');
      const formFeedback = document.getElementById('formFeedback');
      const linkForgot = document.getElementById('linkForgot');
      const modalForgot = document.getElementById('modalForgot');
      const btnCloseModal = document.getElementById('btnCloseModal');

      function setFeedback(msg, isSuccess) {
        if (!msg) {
          formFeedback.textContent = '';
          formFeedback.className = 'form-feedback';
          return;
        }
        formFeedback.textContent = msg;
        formFeedback.className = 'form-feedback active' + (isSuccess ? ' success' : '');
      }

      // Xử lý form submit
      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const u = (txtUsername.value || '').trim();
        const p = (txtPassword.value || '').trim();

        if (!u || !p) {
          setFeedback('Vui lòng nhập đầy đủ Tên đăng nhập và Mật khẩu.');
          if (!u) txtUsername.focus();
          else txtPassword.focus();
          return;
        }

        setFeedback('');
        btnLogin.disabled = true;
        const originalText = btnLogin.textContent;
        btnLogin.textContent = 'ĐANG XÁC THỰC...';

        // Gọi Google Apps Script backend nếu có runtime
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function (res) {
              btnLogin.disabled = false;
              btnLogin.textContent = originalText;
              if (res && res.success) {
                setFeedback('Đăng nhập thành công! Đang chuyển hướng...', true);
                setTimeout(function () {
                  if (res.redirectUrl) window.location.href = res.redirectUrl;
                }, 900);
              } else {
                setFeedback((res && res.message) || 'Tên đăng nhập hoặc mật khẩu không đúng.');
              }
            })
            .withFailureHandler(function (err) {
              btnLogin.disabled = false;
              btnLogin.textContent = originalText;
              setFeedback('Lỗi kết nối máy chủ: ' + (err.message || err));
            })
            .checkLogin(u, p);
        } else {
          // Môi trường demo web (GitHub Pages)
          setTimeout(function () {
            btnLogin.disabled = false;
            btnLogin.textContent = originalText;
            if (u.toLowerCase() === 'admin' && p === '123456') {
              setFeedback('Đăng nhập thành công! (Môi trường Demo)', true);
            } else {
              setFeedback('Thông tin đăng nhập không hợp lệ trên môi trường thử nghiệm.');
            }
          }, 900);
        }
      });

      // Mở / Đóng Modal Quên mật khẩu
      linkForgot.addEventListener('click', function (e) {
        e.preventDefault();
        modalForgot.classList.add('active');
        modalForgot.setAttribute('aria-hidden', 'false');
      });

      btnCloseModal.addEventListener('click', function () {
        modalForgot.classList.remove('active');
        modalForgot.setAttribute('aria-hidden', 'true');
      });

      modalForgot.addEventListener('click', function (e) {
        if (e.target === modalForgot) {
          modalForgot.classList.remove('active');
          modalForgot.setAttribute('aria-hidden', 'true');
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modalForgot.classList.contains('active')) {
          modalForgot.classList.remove('active');
          modalForgot.setAttribute('aria-hidden', 'true');
        }
      });
    })();
  </script>
</body>
