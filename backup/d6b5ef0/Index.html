<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AP CAR CARE – Premium Welcome</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg-black: #000000;
      --glow-blue: #8ab4f8; /* Google light blue */
      --glow-blue-dark: #4285f4;
      --font-brand: 'Space Grotesk', sans-serif;
    }
    body {background: var(--bg-black); color: #fff; font-family: var(--font-brand); overflow:hidden;}
    .stage {position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10;}
    /* ---- Sequence ---- */
    .black-screen {background: var(--bg-black); position:absolute; inset:0; animation:fadeOut 0.5s ease-out forwards 0.5s;}
    .light-streak {position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; animation:streak 0.6s ease-out forwards 1s;}
    .streak {width:2px; height:100%; background:linear-gradient(180deg,var(--glow-blue-dark)0%,transparent 80%);}
    .logo {width:140px; height:140px; opacity:0; animation:logoFade 0.6s ease-out forwards 1.6s, logoShift 0.6s ease-out forwards 2.2s; box-shadow:0 8px 20px rgba(0,0,0,0.4);}
    .logo::before {
      content:''; position:absolute; inset:-4px; border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,0.4) 0%,rgba(66,133,244,0.3) 60%);
      opacity:0; animation:glint 0.8s ease-out forwards 1.6s;
    }
    .brand-text {position:absolute; top:calc(50% + 80px); left:50%; transform:translateX(-50%); opacity:0; white-space:nowrap; font-size:1.2rem; animation:slideRight 0.6s ease-out forwards 2.8s;}
    .form {position:absolute; top:calc(50% + 130px); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:0.6rem; opacity:0; animation:formIn 0.8s ease-out forwards 3.2s;}
    .input {width:280px; padding:0.5rem 1rem; background:rgba(255,255,255,0.85); color:#000; border:none; border-radius:0.5rem; font-size:0.93rem;}
    .input::placeholder {color:#555;}
    .btn {width:280px; padding:0.7rem; background:linear-gradient(135deg, var(--glow-blue-dark), var(--glow-blue)); color:#fff; border:none; border-radius:0.5rem; font-weight:600; cursor:pointer;}
    @keyframes fadeOut {to {opacity:0;}}
    @keyframes streak {to {opacity:1; transform:scaleY(1);}}
    @keyframes logoFade {to {opacity:1; transform:scale(1) translateY(0);}}
    @keyframes glint {to {opacity:0.6;}}
    @keyframes logoShift {to {transform:scale(0.6) translateY(-120px);}}
    @keyframes slideRight {from {opacity:0; transform:translateX(-30px);} to {opacity:1; transform:translateX(0);} }
    @keyframes formIn {to {opacity:1;}}
    @media (max-width:600px) {
      .logo {width:100px; height:100px;}
      .input, .btn {width:240px;}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="black-screen"></div>
    <div class="light-streak"><div class="streak"></div></div>
    <img src="https://raw.githubusercontent.com/triducmkt/App-AP-CAR-CARE/main/assets/logo_ap_white.png" alt="AP Logo" class="logo" />
    <div class="brand-text">AP CAR CARE. AUDIO & ACCESSORIES</div>
    <div class="form">
      <input type="text" placeholder="Tên đăng nhập" class="input" />
      <input type="password" placeholder="Mật khẩu" class="input" />
      <button class="btn">Đăng nhập</button>
    </div>
  </div>
</body>
</html>
