<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AP CAR CARE - Audio & Accessories | Luxury Welcome & Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --surface-black: #08090C;
      --card-bg: rgba(18, 20, 26, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-white: #FFFFFF;
      --text-muted: #8E95A5;
      --google-blue: #4285F4;
      --google-blue-light: #8AB4F8;
      --google-blue-glow: rgba(66, 133, 244, 0.35);
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.12);
      --font-brand: 'Space Grotesk', -apple-system, sans-serif;
      --font-body: 'Montserrat', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Luxury Studio Lighting */
    .studio-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 50% 25%, rgba(66, 133, 244, 0.07) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
        radial-gradient(circle at 20% 85%, rgba(66, 133, 244, 0.04) 0%, transparent 50%),
        linear-gradient(180deg, #020203 0%, #000000 100%);
    }

    /* Studio Floor Reflection Line */
    .studio-light-bar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(66, 133, 244, 0.4), rgba(255, 255, 255, 0.6), rgba(66, 133, 244, 0.4), transparent);
      box-shadow: 0 0 30px rgba(66, 133, 244, 0.3);
      z-index: 1;
      opacity: 0.7;
    }

    /* Top Control Bar (Demo Helper) */
    .demo-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(18, 20, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
    }

    .demo-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-white);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .demo-btn:hover, .demo-btn.active {
      background: var(--google-blue);
      border-color: var(--google-blue);
      box-shadow: 0 0 15px var(--google-blue-glow);
    }

    /* Main Viewport Container */
    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Mobile Simulation Mode */
    .app-viewport.mode-mobile {
      max-width: 414px;
      min-height: 840px;
      height: 840px;
      border: 10px solid #1E2026;
      border-radius: 44px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 30px rgba(66, 133, 244, 0.15);
      overflow: hidden;
      margin: 40px auto;
      background: #000000;
    }

    /* Main Branding Header Container */
    .brand-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 36px;
      transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Circular AP Logo Container */
    .ap-logo-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    /* Metallic Rim & Glow */
    .ap-logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(66, 133, 244, 0.6) 50%, rgba(255, 255, 255, 0.1) 100%);
      z-index: 1;
      opacity: 0.8;
      box-shadow: 0 0 25px rgba(66, 133, 244, 0.35);
      transition: all 0.8s ease;
    }

    .ap-logo-wrapper::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(66, 133, 244, 0.25) 0%, transparent 70%);
      z-index: 0;
      filter: blur(8px);
    }

    .ap-logo-img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #000000;
      border: 2px solid #000000;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
    }

    /* Typography: Brand Title */
    .brand-title-box {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      transform: translateX(-15px);
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .brand-title-main {
      font-family: var(--font-brand);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1.15;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .brand-title-sub {
      font-family: var(--font-brand);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 5px;
      color: var(--google-blue-light);
      text-transform: uppercase;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title-sub::before, .brand-title-sub::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 1px;
      background: rgba(138, 180, 248, 0.6);
    }

    /* Luxury Login Box */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 38px 34px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(66, 133, 244, 0.12);
      border: 1px solid rgba(66, 133, 244, 0.3);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--google-blue-light);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .login-heading {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-white);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 26px;
    }

    /* Input Fields */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: #C0C6D4;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: #6A7285;
      width: 18px;
      height: 18px;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .form-input {
      width: 100%;
      height: 52px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 0 16px 0 46px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-white);
      outline: none;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .form-input::placeholder {
      color: #555C6E;
    }

    .form-input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--google-blue);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.25), 0 0 20px rgba(66, 133, 244, 0.15);
    }

    .form-input:focus + .input-icon, .form-input:focus ~ .input-icon {
      color: var(--google-blue-light);
    }

    /* Login Action Button */
    .login-btn {
      width: 100%;
      height: 52px;
      margin-top: 10px;
      background: linear-gradient(135deg, #4285F4 0%, #1A73E8 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: var(--text-white);
      font-family: var(--font-brand);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(66, 133, 244, 0.35);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: all 0.6s ease;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #5394FF 0%, #207BF0 100%);
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(66, 133, 244, 0.5);
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:active {
      transform: translateY(0);
      box-shadow: 0 5px 15px rgba(66, 133, 244, 0.4);
    }

    /* Footer Meta */
    .card-footer-meta {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #6A7285;
    }

    .card-footer-meta a {
      color: var(--google-blue-light);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .card-footer-meta a:hover {
      color: var(--text-white);
      text-decoration: underline;
    }

    /* Status Banner (Connected Sheet Info) */
    .sheet-meta-tag {
      margin-top: 30px;
      font-size: 11px;
      color: #555C6E;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .sheet-dot {
      width: 6px;
      height: 6px;
      background: #34A853;
      border-radius: 50%;
      box-shadow: 0 0 8px #34A853;
    }

    /* ======================================================= */
    /* MOTION GRAPHIC & 3D ANIMATION SCRIPT SEQUENCING        */
    /* ======================================================= */

    /* Stage 0 (0.0s - 0.5s): Pure pitch black */
    body.stage-0 .ap-logo-wrapper {
      opacity: 0;
      transform: scale(0.6) rotateY(25deg);
    }
    body.stage-0 .brand-title-box {
      opacity: 0;
      transform: translateX(-20px);
    }
    body.stage-0 .login-card {
      opacity: 0;
      transform: translateY(40px);
    }

    /* Stage 1 (0.5s - 1.8s): Big Logo Center with 3D Float */
    body.stage-1 .ap-logo-wrapper {
      opacity: 1;
      transform: scale(1.65) rotateY(0deg) translateY(0);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      animation: float3D 3s ease-in-out infinite alternate;
    }
    body.stage-1 .brand-title-box {
      opacity: 0;
      width: 0;
      margin: 0;
      pointer-events: none;
    }
    body.stage-1 .login-card {
      opacity: 0;
      transform: translateY(40px);
      pointer-events: none;
    }

    /* Stage 2 (1.8s - 2.8s): Logo Shrunk + Brand Title Reveals */
    body.stage-2 .ap-logo-wrapper {
      opacity: 1;
      transform: scale(1) rotateY(0deg);
      animation: none;
    }
    body.stage-2 .brand-title-box {
      opacity: 1;
      transform: translateX(0);
      width: auto;
    }
    body.stage-2 .login-card {
      opacity: 0;
      transform: translateY(40px);
      pointer-events: none;
    }

    /* Stage 3 (2.8s+): Form Animate in & Everything interactive */
    body.stage-3 .ap-logo-wrapper {
      opacity: 1;
      transform: scale(1) rotateY(0deg);
    }
    body.stage-3 .brand-title-box {
      opacity: 1;
      transform: translateX(0);
    }
    body.stage-3 .login-card {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    @keyframes float3D {
      0% {
        transform: scale(1.65) translateY(0px) rotateY(-8deg) rotateX(4deg);
      }
      100% {
        transform: scale(1.65) translateY(-10px) rotateY(8deg) rotateX(-4deg);
      }
    }

    /* ======================================================= */
    /* RESPONSIVE RULES (MOBILE LAYOUT ADJUSTMENT)             */
    /* ======================================================= */
    @media (max-width: 640px) or (max-height: 700px) {
      .brand-hero {
        flex-direction: column;
        text-align: center;
        margin-bottom: 24px;
      }

      .brand-title-box {
        margin-left: 0;
        margin-top: 16px;
        transform: translateY(-10px);
        align-items: center;
      }

      body.stage-2 .brand-title-box, body.stage-3 .brand-title-box {
        transform: translateY(0);
      }

      .brand-title-main {
        font-size: 20px;
        letter-spacing: 2px;
      }

      .brand-title-sub {
        font-size: 11px;
        letter-spacing: 3.5px;
      }

      .ap-logo-wrapper {
        width: 105px;
        height: 105px;
      }

      body.stage-1 .ap-logo-wrapper {
        transform: scale(1.4) rotateY(0deg);
      }

      .login-card {
        padding: 28px 22px;
        border-radius: 18px;
      }

      .form-input {
        height: 48px;
        font-size: 15px; /* prevent iOS auto-zoom */
      }

      .login-btn {
        height: 48px;
      }

      .demo-controls {
        top: 10px;
        right: 10px;
        padding: 4px 8px;
      }
      .demo-btn {
        padding: 4px 10px;
        font-size: 11px;
      }
    }

    /* Luxury Mouse Parallax Container */
    .parallax-layer {
      transition: transform 0.15s ease-out;
    }
  </style>
</head>

  <script>
    // Sequence Timers
    let animTimers = [];

    function clearAllTimers() {
      animTimers.forEach(t => clearTimeout(t));
      animTimers = [];
    }

    // 4-Stage Motion Graphic Script
    function runMotionGraphicSequence() {
      clearAllTimers();
      const body = document.body;

      // Stage 0: 0.0s - 0.5s (Black Screen)
      body.className = 'stage-0';

      // Stage 1: 0.5s - 1.8s (Big Logo Fade-in + 3D Tilt)
      animTimers.push(setTimeout(() => {
        body.className = 'stage-1';
      }, 500));

      // Stage 2: 1.8s - 2.8s (Logo Shrunk + Title Reveal)
      animTimers.push(setTimeout(() => {
        body.className = 'stage-2';
      }, 1800));

      // Stage 3: 2.8s+ (Form Slide-up & Fully Interactive)
      animTimers.push(setTimeout(() => {
        body.className = 'stage-3';
      }, 2800));
    }

    // Restart Animation Helper
    function restartAnimation() {
      runMotionGraphicSequence();
    }

    // Device View Mode Toggle (PC <-> Mobile)
    function toggleDeviceMode() {
      const vp = document.getElementById('viewport');
      const btnText = document.getElementById('deviceModeText');
      const isMobile = vp.classList.toggle('mode-mobile');
      
      if (isMobile) {
        btnText.textContent = "Chuyển PC Full";
      } else {
        btnText.textContent = "Chuyển Mobile";
      }
    }

    // 3D Parallax Mouse Tracking for PC Mode
    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 768) return;
      const x = (e.clientX / window.innerWidth - 0.5) * 16;
      const y = (e.clientY / window.innerHeight - 0.5) * 16;
      
      const hero = document.getElementById('brandHero');
      const card = document.getElementById('loginCard');
      
      if (document.body.classList.contains('stage-3')) {
        hero.style.transform = 	ranslate3d(px, px, 0);
        card.style.transform = 	ranslate3d(px, px, 0);
      }
    });

    // Handle Login Submit Demo
    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('txtUsername').value;
      const btn = document.getElementById('btnLogin');
      
      btn.innerHTML = "<span>ĐANG XÁC THỰC...</span>";
      btn.style.opacity = '0.8';
      btn.disabled = true;

      // Simulate verification with Google Apps Script backend
      setTimeout(() => {
        alert("Xin chào " + u + "!\\n\\nXác thực thành công với hệ thống Google Apps Script & Google Sheet ID: 1ziGRRq92AxX9BnDMYbHF-iES7XskALCaOK6LeUw_IS0");
        btn.innerHTML = '<span>ĐĂNG NHẬP</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
        btn.style.opacity = '1';
        btn.disabled = false;
      }, 1200);
    }

    // Auto-run on page load
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runMotionGraphicSequence);
    } else {
      runMotionGraphicSequence();
    }
  
  </script>
